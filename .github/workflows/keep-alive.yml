name: Keep backend warm

on:
  schedule:
    # 10분마다 헬스체크 핑 - Render 프리티어의 15분 비활성 슬립을 방지
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sS -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            --max-time 25 --retry 2 --retry-delay 5 \
            https://life-fit-backend.onrender.com/api/v3/health
